<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="robots" content="noindex">
<title>AOD · Opening wall…</title>
<!--
  AOD scan router.
  Every piece label's QR code points HERE, not straight at Airtable:
      https://<this page>/?r=/recXXXXXXXXXXXXXX
  This page reads the wall's record ID and sends the phone to the Airtable link
  that works on that phone:
      iPhone / iPad / desktop -> Scan · Walls list page + record   (detail page loads blank on iPhone)
      Android                 -> Scope · Scan record page + record (list page drops the record on Android)
  If Airtable changes how its app handles links, change the two lines below.
  Printed labels never need reprinting.
  Lives in the PUBLIC repo AltOptionDesign/aod-scan (free GitHub Pages). Keep it to this one file.
-->
<style>
  :root { color-scheme: light; --bg:#f5f3ef; --ink:#2b2a27; --mute:#77736b; --accent:#e5562a; --card:#fff; }
  @media (prefers-color-scheme: dark) { :root { color-scheme: dark; --bg:#1d1c1a; --ink:#f2efe9; --mute:#a8a397; --card:#2a2926; } }
  * { box-sizing: border-box; }
  html, body { height: 100%; margin: 0; }
  body { background: var(--bg); color: var(--ink); font: 17px/1.4 -apple-system, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
         display: grid; place-items: center; padding: env(safe-area-inset-top) 20px env(safe-area-inset-bottom); }
  .card { background: var(--card); border-radius: 16px; padding: 28px 24px; max-width: 360px; width: 100%; text-align: center; }
  .dot { width: 14px; height: 14px; border-radius: 50%; background: var(--accent); margin: 0 auto 14px; animation: p 1s ease-in-out infinite alternate; }
  @keyframes p { from { opacity: .35 } to { opacity: 1 } }
  h1 { font-size: 20px; margin: 0 0 6px; }
  p { color: var(--mute); margin: 0 0 18px; font-size: 15px; }
  a.btn { display: block; padding: 14px; border-radius: 10px; margin-top: 10px; text-decoration: none; font-weight: 600; }
  a.main { background: var(--accent); color: #fff; }
  a.alt { color: var(--ink); border: 1px solid var(--mute); }
  .hide { display: none; }
</style>
</head>
<body>
<div class="card">
  <div class="dot" id="dot"></div>
  <h1 id="title">Opening this wall…</h1>
  <p id="msg">If nothing happens, tap the button.</p>
  <a class="btn main hide" id="go" href="#">Open wall</a>
  <a class="btn alt hide" id="other" href="#">Blank page? Try the other link</a>
</div>
<script>
  // ---- The only lines to change if Airtable moves things ----
  var BASE      = 'https://airtable.com/appUXnAIsPihKVdpI';
  var LIST_PAGE = 'pagOwX3n6uLgf915g'; // MOBILE > Scan · Walls (works on iPhone)
  var REC_PAGE  = 'pagDDDyM438ZRa79v'; // Scope · Scan record page (works on Android)
  // -------------------------------------------------------------

  var raw = location.search + ' ' + location.hash + ' ' + location.pathname;
  var m = raw.match(/rec[A-Za-z0-9]{14}/);
  var go = document.getElementById('go'), other = document.getElementById('other');

  if (!m) {
    document.getElementById('dot').className = 'hide';
    document.getElementById('title').textContent = 'No wall on this label';
    document.getElementById('msg').textContent = 'This QR code has no wall ID in it. Reprint the label from the Label Printer.';
  } else {
    var rec = m[0];
    var android = /Android/i.test(navigator.userAgent);
    var best  = BASE + '/' + (android ? REC_PAGE : LIST_PAGE) + '/' + rec;
    var spare = BASE + '/' + (android ? LIST_PAGE : REC_PAGE) + '/' + rec;
    go.href = best; other.href = spare;
    go.className = 'btn main'; other.className = 'btn alt';
    location.replace(best);
  }
</script>
</body>
</html>
